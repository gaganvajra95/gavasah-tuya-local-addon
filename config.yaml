name: "Gavasah Tuya LAN Gateway"
slug: "gavasah-tuya-local"
version: "1.2.1"
description: "High-performance zero-cloud Tuya LAN bridge with realtime bidirectional MQTT discovery, persistent TCP session management, and native DALI DT6/DT8 support."
url: "https://dealer.gavasah.com"
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
init: false
host_network: true
ingress: true
ingress_port: 8199
panel_icon: "mdi:transit-connection-variant"
panel_title: "Tuya LAN"
homeassistant_api: true

options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  log_level: "info"
  auto_discover_udp: true
  devices: []

schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
  log_level: list(debug|info|warn|error)
  auto_discover_udp: bool
  devices:
    - id: str
      name: str
      ip: str
      local_key: str
      version: list(3.1|3.3|3.4|3.5)
      type: list(dali_gateway|light_cct|light_rgb|dimmer|switch|sensor)?

